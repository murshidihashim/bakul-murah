# Build the data from PriceCatcher and publish the site on GitHub Pages.
#
# Runs every Monday 05:17 UTC (13:17 Malaysia time), on every push to main, and by hand
# (Actions tab -> refresh-and-deploy -> Run workflow, on any branch).
# The price data is rebuilt on each run and deployed with the site; it is not committed on main.
# Shop map points, the postcode table and the place list (etl/geo/) are committed back.
# Only main deploys. A run on another branch also commits web/data there, as a preview to test.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: refresh-and-deploy

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      geo_minutes:
        description: "Minutes for shop location lookups (at most 100)"
        required: false
        default: "40"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        shell: bash
    env:
      GEO_MINUTES: ${{ inputs.geo_minutes || '40' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Keep downloaded months between runs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: pricecatcher-raw-${{ github.run_id }}
          restore-keys: pricecatcher-raw-

      - name: Fetch PriceCatcher
        timeout-minutes: 20
        run: python etl/fetch_pricecatcher.py --months 12

      # Optional: without a fresh table the old one (or district centres) is used.
      - name: Fetch postcodes (GeoNames)
        continue-on-error: true
        timeout-minutes: 5
        run: python etl/fetch_postcodes.py

      # Optional: towns and villages with their own points, to check the postcode table's towns.
      - name: Fetch places (GeoNames)
        continue-on-error: true
        timeout-minutes: 5
        run: python etl/fetch_places.py

      - name: Build
        id: build
        timeout-minutes: 15
        run: python etl/build_dataset.py --months 12

      # Optional: new shops first, then retries of weak points, until the minutes run out.
      - name: Shop locations (OpenStreetMap)
        continue-on-error: true
        timeout-minutes: 120
        run: |
          # Whole minutes only: anything else (or 4+ digits) means the default 40; at most 100.
          m="$GEO_MINUTES"
          case "$m" in ''|*[!0-9]*|????*) m=40 ;; esac
          if [ "$m" -gt 100 ]; then m=100; fi
          python etl/geocode_premises.py --max-minutes "$m" | tee "$RUNNER_TEMP/geo.log"
          echo "Shop locations: \`$(tail -n 1 "$RUNNER_TEMP/geo.log")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build again with shop locations
        id: build2
        timeout-minutes: 15
        run: python etl/build_dataset.py --months 12

      - name: Test
        timeout-minutes: 10
        run: |
          python -m pytest etl/tests -q
          node --test tests/web/basket.test.js tests/web/listparse.test.js tests/web/near.test.js

      # Runs even if an optional step or the tests failed, but only after a good build.
      # Off main, web/data goes in its own commit: drop that commit when merging into main.
      - name: Save new shop locations
        if: ${{ !cancelled() && steps.build2.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          saved=no
          git add etl/geo
          if ! git diff --cached --quiet; then
            git commit -m "Shop locations: new shops $(date -u +%Y-%m-%d)"
            saved=yes
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            git add -f web/data
            if ! git diff --cached --quiet; then
              git commit -m "Preview data $(date -u +%Y-%m-%d) (to test this branch; do not merge into main)"
              saved=yes
            fi
          fi
          if [ "$saved" = yes ]; then
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Nothing new to save."
          fi

      # A failure here stops the deploy, so the last good site stays live.
      # The live meta.json is optional: a slow or failed download only skips the comparison.
      - name: Check data
        timeout-minutes: 5
        run: |
          curl -fsS --max-time 30 --retry 2 https://murshidihashim.github.io/bakul-murah/data/meta.json -o "$RUNNER_TEMP/prev_meta.json" || true
          python etl/check_data.py --previous "$RUNNER_TEMP/prev_meta.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Size report
        run: |
          {
            echo "## Bakul Murah build"
            echo "Data date: $(python -c 'import json;print(json.load(open("web/data/meta.json"))["data_date"])')"
            echo "District files: $(ls web/data/d/*.json | wc -l)"
            echo "Site size: $(du -sh web | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
